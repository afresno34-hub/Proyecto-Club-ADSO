<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Pago - MR CLUB</title>
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>
    <div class="Contenedor-Formulario">
        <nav class="nav-pestanas">
            <a href="dashboard.html" class="pestana volver">⬅ Panel</a>
            <a href="listaAsociados.html" class="pestana">👥 Asociados</a>
            <a href="asociados.html" class="pestana">➕ Nuevo Asociado</a>
            <a href="actividades.html" class="pestana">📋 Listado Actividades</a>
            <a href="registrarActividad.html" class="pestana">➕ Nueva Actividad</a>
            <a href="prestamos.html" class="pestana">💰 Préstamos</a>
            <a href="pagos.html" class="pestana activa">💳 Pagos</a>
        </nav>

        <h2>Registro de Pago</h2>
        <form id="formPago" action="" method="POST">
            
            <div class="grupo-input">
                <label for="idPrestamo">ID del Préstamo:</label>
                <input id="idPrestamo" name="idPrestamo" type="number" required placeholder="Ej. 1">
            </div>

            <div class="grupo-input">
                <label for="valorCuota">Valor de la Cuota:</label>
                <input id="valorCuota" name="valorCuota" type="number" step="0.01" required placeholder="Ej. 50000">
            </div>

            <div class="grupo-input">
                <label for="fechaPago">Fecha de Pago:</label>
                <input id="fechaPago" name="fechaPago" type="date" required>
            </div>

            <div class="grupo-botones">
                <button type="submit">Registrar Pago</button>
                <button type="reset">Limpiar</button>
            </div>

        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR CLUB - Inicio de Sesión</title>
    <link rel="stylesheet" href="../assets/CSS/estilos.css">
</head>
<body>
    <div class="Contenedor-Formulario">
        <h2>Inicio de Sesión</h2>
        <form id="formLogin" action="../Modelo/IniciarSesion.php" method="POST">
            <div class="grupo-input">
                <label for="usuario">Usuario:</label>
                <input id="usuario" name="usuario" type="text" required placeholder="Ingrese su usuario o correo">
            </div>

            <div class="grupo-input">
                <label for="contraseña">Contraseña:</label>
                <input id="contraseña" name="contraseña" type="password" required placeholder="Ingrese su contraseña">
            </div>  

            <div class="grupo-botones">
                <button type="submit">Ingresar</button>
                <button type="reset">Limpiar Formulario</button>
            </div>

            <div class="registro" style="text-align: center; margin-top: 18px;">
                <p>¿No tienes una cuenta? <a href="asociados.html" style="font-weight: bold; color: #004d40;">Regístrate aquí</a></p>
            </div>
            <p id="mensajeLogin" class="text-danger mt-3 mb-0"></p>
        </form>
    </div>

    <script src="../Controlador/login.js"></script>
</body>
</html>
